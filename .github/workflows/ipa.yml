name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          ls -d /Applications/Xcode*
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          xcodebuild -version
          df -h /

      - name: Create canonical source directory
        run: |
          sudo mkdir -p /Users/Shared
          sudo chown $(whoami) /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/telegram-ios

      - name: Build the App
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          NOVA_API_KEY: ${{ secrets.NOVA_API_KEY }}
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          BUILD_NUMBER="$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))"
          python3 - <<'CFG'
          import json, os
          c = json.load(open("build-system/appstore-configuration.json"))
          c["sg_config"] = json.dumps({
              "api_url": "https://api.swiftgram.app",
              "webapp_url": "https://my.swiftgram.app",
              "bot_username": "SwiftgramBot",
              "iaps": [],
              "nova_api_url": "https://novastream.club/novagram/",
              "nova_api_key": os.environ.get("NOVA_API_KEY", ""),
          }, separators=(",", ":"))  # без пробелов: строка уходит в флаги компилятора, пробел рвёт её на аргументы
          # в купленном профиле нет iCloud-контейнера: CKContainer.default() роняет приложение,
          # когда Telegram ищет запасные адреса (а в РФ ищет почти сразу)
          c["enable_icloud"] = False
          if os.environ.get("TG_API_ID"):
              c["api_id"] = os.environ["TG_API_ID"]
              c["api_hash"] = os.environ["TG_API_HASH"]
          json.dump(c, open("build-system/nova-configuration.json", "w"), indent=2)
          print("api_id", c["api_id"])
          CFG
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="/private/var/tmp/_bazel_containerhost" \
            build \
            --configurationPath="build-system/nova-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"
          mkdir -p $GITHUB_WORKSPACE/out
          cp bazel-bin/Telegram/*.ipa $GITHUB_WORKSPACE/out/Telegram.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Telegram-ipa
          path: out/Telegram.ipa
          retention-days: 30
